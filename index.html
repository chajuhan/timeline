/*T0*/let META={"a":"\u003cspan style=\"font-weight: normal;\">( \u003ci>Side of existense\u003c/i> )\u003c/span>","b":"","r":""};/*T1*/
/*D0*/let DATA=[{"name":"무죄 추정의 원칙","side":"R","chaps":[{"side":"R","title":"","items":[{"body":"\u003cp>한계는 생각보다 더 이르게 현현하나 그것을 온전히 감내할 정신력은 언제나 한발 늦게 구현된다. 한계의 선고와 그것을 수용할 역량 사이에는 불가피한 시간적 차이가 존재하며, 이는 만유를 관통하는 불가해한 섭리이자 인간 또한 결코 예외일 수 없는 절대적인 이치다.\u003c/p>\u003cp>특별 검사이자 우신병원 외상 및 심장외과 교수. 세간이 정의하는 검사란 시야를 가린 채 천칭의 균형을 유지하고 사사로운 주관을 철저히 배제함으로써 공정한 수사를 통해 사회 정의에 이바지하는 자일 것이다. 그러나 이는 어디까지나 이상향에 가까운 검사상이며, 신화 속 유스티티아가 표상하는 정의의 관념에 불과하다.&nbsp;\u003cspan>차주한은 사회가 간절히 요구하는 이상적인 검사도, 신화 속 유스티티아의 현신도 아니었으므로 그 두 가지 당위에 온전히 부합할 수 없었다.\u003c/span>\u003c/p>\u003cp>신과 달리 선명한 감정을 지녔기에, 누구보다도 복수를 갈망한다는 의지만큼은 명백했던 사람.\u003c/p>\u003cp>천사의 집이라는 명분 아래 서이안과 처음 대면한 차주한은 그녀의 죄를 단정했다. 그러므로 그녀 또한 그를 단정 지을 수밖에 없었다.\u003c/p>\u003cp>\u003ci>안타까운 사람.\u003c/i>\u003c/p>\u003cp>사회가 그토록 갈망하는 정의를 홀로 구현하고자 몇 번이고 세상을 향해 목소리를 높였으나, 그에게 돌아온 것은 맹렬한 비난과 불이익뿐이었다. 사회의 정의를 실현하기 위한 대가로 내놓은 것에 비해 남겨진 것은 지극히 미미했다. 종국에는 모든 것이 0에 수렴했다.\u003c/p>\u003cp>\u003cspan>\u003ci>이번만큼은 그녀의 정의가 옳았다.\u003c/i>\u003c/span>\u003c/p>","st":{"body":"text-align: justify; letter-spacing: calc(var(--b)*-0.053); text-align-last: left;"}}]},{"side":"R","title":"1회차","year":"2017","items":[{"name":"\u003cspan style=\"font-size: calc(var(--b)*1.073);\">차주한\u003c/span>","date":"\u003cspan style=\"font-weight: normal;\">1975. 6. 17\u003c/span>","body":"(1) 서울중앙지방검찰청 형사3부 차장검사\u003cdiv>(2) 법무연수원 연구위원 인사 이동\u003c/div>","side":"L","box":true,"st":{"body":"line-height: 1.4; letter-spacing: calc(var(--b)*-0.053);"},"tl":"\u003cspan style=\"font-weight: normal;\">( \u003ci>canon\u003c/i> )\u003c/span>","ha":"right"},{"name":"서이안","date":"\u003cspan style=\"font-weight: normal;\">1976. 9. 26\u003c/span>","body":"\u003cspan style=\"letter-spacing: calc(var(--b)*-0.053);\">(1) 서울우신병원 외상・심장외과 교수\u003cdiv>(2) 중증외상센터장 임명\u003c/div>\u003c/span>","side":"R","dy":3,"box":true,"st":{"body":"line-height: 1.4;"},"oy":-0.5,"tr":"\u003cspan style=\"font-weight: normal;\">( \u003ci>oc\u003c/i> )\u003c/span>"},{"name":"천사의 집","body":"특별 검사라는 권력으로 천사의 집 조사, 우신병원 내 심장 수술 집도 최대 다수라는 사유로 심문 시작.","side":"L","dy":5,"st":{"name":"text-align: right;","body":"line-height: 1.4; text-align: right; font-size: calc(var(--b)*1.000); letter-spacing: calc(var(--b)*-0.053);"},"ha":"right"},{"body":"\u003ci>- 특검이라고 무분별하게 사람 잡아다가 심문 하시는 게 취미셨어요, 차주한 특별 검사님?\u003c/i>\u003cdiv>\u003ci>\u003cbr>\u003c/i>\u003c/div>\u003cdiv>\u003ci>- 다른 질문은 받지 않습니다. 질문에 대답하세요.\u003c/i>\u003c/div>","side":"R","dy":-8,"st":{"body":"line-height: 1.5; letter-spacing: calc(var(--b)*-0.053);"}},{"name":"■■■","date":"2018","body":"차주한 사망.","side":"L","st":{"body":"text-align: right; letter-spacing: calc(var(--b)*-0.053);"},"oy":10,"ha":"right"}]},{"side":"L","items":[{"body":"\u003ci>그러니까, 한 번만.\u003c/i>\u003cdiv>\u003ci>나에게 단 한 번의 기회가 더 있다면, 그때는⋯⋯\u003c/i>.\u003c/div>","st":{"body":"text-align: right;"},"oy":-6}]}]},{"name":"Re:turn","chaps":[{"side":"R","title":"\u003cspan style=\"font-weight: normal;\">(1)\u003c/span>","items":[{"body":"\u003cspan style=\"letter-spacing: calc(var(--b)*-0.053);\">서울 우신병원. 세상에 이바지하는 의료인이 되고자 하는 이들에게 있어 우신병원은 대한민국에서 손꼽히는 선망의 엘리트 코스이자 선망의 종착지로 여겨진다. 그러나 차주한에게 있어 그곳은 정반대의 의미를 지닌다.\u003c/span>\u003cdiv>\u003cspan style=\"letter-spacing: calc(var(--b)*-0.053);\">\u003cbr>\u003c/span>\u003c/div>\u003cdiv>\u003cspan style=\"letter-spacing: calc(var(--b)*-0.053);\">그곳에서 수년째 굳건히 제 자리를 지키고 있는 서이안. 그리고 1회차와는 모든 것이 뒤바뀐 자신, 그럼에도 조금도 달라지지 않은 그녀. 차주한은 자신과 그녀 사이에 놓인 기이한 괴리감에 잠시 골몰했다.\u003c/span>\u003c/div>\u003cdiv>\u003cspan style=\"letter-spacing: calc(var(--b)*-0.053);\">\u003cbr>\u003c/span>\u003c/div>\u003cdiv>\u003cspan style=\"letter-spacing: calc(var(--b)*-0.053);\">몇 번의 심문을 거쳐 서이안이 천사의 집과는 일절 무관한 인물이라는 사실을 알게 된 이후에도 차주한의 바람은 변하지 않았다. 타의에 의해 익사하기 직전까지도 그는 서이안이 더는 우신과 연을 맺지 않기를 바랐다. 그러나 세상은 언제나 그러하듯, 한 개인의 소망만으로 기꺼이 달라져 주지 않았다.\u003c/span>\u003c/div>\u003cdiv>\u003cspan style=\"letter-spacing: calc(var(--b)*-0.053);\">\u003cbr>\u003c/span>\u003c/div>\u003cdiv>\u003cspan style=\"letter-spacing: calc(var(--b)*-0.053);\">그럼에도 굳이 이전과 달라진 것을 헤아려야 한다면, 다를 것 없는 현실에 수식어를 부여해야 한다면, 몇 가지 명백한 차이는 존재했다. 차주한이 여생의 대부분을 바쳐 온 검사직을 내려놓았다는 것. 서이안이 의료사고의 피고인이 되었다는 것. 그리고 그가 의도치 않게 그녀의 변호를 맡게 되었다는 것.&nbsp;\u003c/span>\u003cspan style=\"letter-spacing: calc(var(--b)*-0.053);\">무엇보다 중요한 건 차주한은 서이안이 무고하다는 사실을 알고 있다는 것.\u003c/span>\u003c/div>\u003cdiv>\u003cspan style=\"letter-spacing: calc(var(--b)*-0.053);\">\u003cbr>\u003c/span>\u003c/div>\u003cdiv>\u003cspan style=\"letter-spacing: calc(var(--b)*-0.053);\">서이안과 차주한. 오로지 차주한만이 기억하는 1회차의 만남을 뒤로하고, 두 사람의 두 번째 만남이 시작되었다. 이전보다 한층 절실함을 품은 채로.\u003cbr>\u003cdiv>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv>\u003ci>- 차주한 변호사님, 도와주세요.\u003c/i>\u003c/div>\u003c/div>\u003c/span>\u003c/div>","st":{"body":"text-align: justify; text-align-last: left;"}}]},{"side":"L","title":"\u003cspan style=\"font-weight: normal;\">(2)\u003c/span>","items":[{"body":"\u003cdiv>\u003ci>- 따라서 주문과 같이 판결한다.\u003c/i>\u003cbr>\u003c/div>\u003cdiv class=\"\">\u003ci>\u003cbr>\u003c/i>\u003c/div>\u003cdiv>예견된 결과였다. 재판은 차주한의 승소로 종결되었으며, 그가 자신의 능력을 온전히 발휘할 수 있는 한 무패의 기록은 깨지지 않을 터였다. 그는 비로소 한결 가벼워진 심중으로 곁에 선 그녀를 바라보았다.&nbsp;\u003cspan>서이안의 눈동자에는 이따금 설명하기 어려운 고요와 미묘한 고양감이 공존했다. 차분함과 들뜸이라는 상반된 기색이 한데 깃든 그 이중성을 그는 몇 차례 목격한 바 있었다. 다만 차주한은 그러한 눈빛이 더는 우신병원이 아닌, 다른 병원에서 이어지기를 바랐다.&nbsp;\u003c/span>\u003cspan>물론 그녀가 이를 거절한다면 그 또한 어쩔 수 없는 일이었다. 선택은 어디까지나 그녀의 몫이었으므로. 반대로 제안을 받아들인다면 기꺼이 축하할 것이었다. 어느 쪽이든 그녀의 결정을 존중할 수 있다는 것만큼은 분명했다.\u003c/span>\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv>\u003ci>서이안 씨.\u003c/i>\u003c/div>\u003cdiv>\u003ci>네, 변호사님.\u003c/i>\u003c/div>\u003cdiv>\u003ci>이제 다른 병원으로 가실 겁니까, 아니면 우신병원에 계속 있으실 겁니까? 강요하는 건 아니나 되도록⋯⋯.\u003c/i>\u003c/div>\u003cdiv class=\"\">\u003ci>\u003cbr>\u003c/i>\u003c/div>\u003cdiv>이내 맑고 선연한 그녀의 목소리가 들려왔다.&nbsp;\u003cspan>\u003ci>제가 거기 계속 있으면 바보겠죠.&nbsp;\u003c/i>\u003c/span>\u003cspan>차주한은 서이안의 눈동자를 가만히 응시했다. 그 안에는 감사와 더불어 조금의 흐림도 없는 존경이 담겨 있었다. 같은 직업적 소명을 공유하지 않더라도, 서로의 신념과 걸어온 궤적을 이해하는 일은 가능한 것일까. 문득 그런 의문을 품었다.\u003c/span>\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv>\u003ci>다음에도 무슨 일 생기면 올게요.\u003c/i>\u003c/div>\u003cdiv>\u003ci>되도록 의료 사건이 아니었으면 합니다.\u003c/i>\u003c/div>\u003cdiv>\u003ci>왜죠?\u003c/i>\u003c/div>\u003cdiv>\u003ci>⋯⋯서이안 씨 같으면 하고 싶겠습니까.\u003c/i>\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv>그녀는 그의 말에 웃음을 터뜨렸다. 어쩌면 그 순간, 서이안은 차주한을 두고 자신이 여태 짐작해 온 것보다 훨씬 나은 사람일지도 모른다고 생각했을 것이다.\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv class=\"\">예외였던가.&nbsp;\u003cspan>차주한은 어느 순간부터 서이안과 연락을 주고받는 빈도가 부쩍 늘었다는 사실을 깨달았다. 불과 몇 달 전까지만 해도 사건과 관련된 용건으로만 채워져 있던 문자 내역에는 이제 점심 메뉴 추천이나 직장 상사에 관한 푸념이 자리 잡았고, 통화 기록에는 서이안이라는 세 글자가 유독 빈번하게 모습을 드러냈다.\u003c/span>\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv class=\"\">잠시 숨을 돌리는 틈마다 휴대전화를 들어 자연스레 그녀에게 문자를 보내려는 자신과 마주할 때면 그는 이래서는 안 된다는 말을 몇 번이고 되뇌었다. 그러나 인간이란 본디 자신에게 한결같은 애정을 쏟는 존재에게 점차 무뎌지기 마련인 무른 성정을 지녔으며, 인간 차주한이라고 그 섭리에서 예외일 리 없었다.\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv class=\"\">결국 그는 휴대전화의 전원을 다시 켰다.\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv class=\"\">연락을 주고받던 중 별안간 답장을 끊어 버리면 서이안이 서운해할 테니까. 그래, 그저 그것뿐이었다.\u003c/div>\u003cdiv class=\"clk\" data-m=\"m1\">\u003cspan class=\"ck\" role=\"button\" tabindex=\"0\">( \u003ci>click\u003c/i> )\u003c/span>\u003c/div>","st":{"body":"text-align: justify; text-align-last: left;"}}]},{"side":"L","items":[{"body":"서이안은 한동안 차주한과 문자를 주고받았다. 그러다 답장이 늦어지자 초조해하는 자신을 발견하고는 낯선 감각에 잠시 골몰했다. 그녀는 누군가 다가오기를 기다리는 사람이었지 먼저 손을 내미는 사람은 아니었다.\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>무엇보다 그녀에게 중요한 것은 자신의 안위였다. 타인과 깊은 관계를 형성하는 일에는 별다른 관심도, 필요성도 느끼지 못했다. 그러므로 다가오는 이를 굳이 밀어내지도, 떠나는 이를 붙잡으려 애쓰지도 않았다. 여태껏 이어 온 연애 또한 크게 다르지 않았다. 이십 대의 어느 시절 혼약 이야기가 오가던 때에도 마찬가지였다. 어디까지나 이해관계에 따른 계약일 뿐이었으며, 그 안에서 사적인 감정이 싹틀 리 없다고 여겼으므로.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>그런 까닭에 그녀는 동료애를 제외하고 타인, 특히 이성에게 사랑이나 유대와 같은 감정을 할애하는 정서적 기제가 자신에게는 부재한다고 생각했다. 누군가를 온전히 독점하고 싶었던 적도, 앞으로 그러한 욕망을 품게 될 날이 있으리라고 상상한 적도 없었다.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>그러나 어느 순간부터 예외가 생겨났다.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>자신을 향해 먼저 내밀어 주는 손이, 어쩌다 한 번씩 입가에 머무는 옅은 미소가 자꾸만 시야에 걸렸다. 한때는 그저 각막에 맺혔다가 이내 휘발될 잔상에 불과했을 터였다. 그러나 어느덧 그의 형상은 그녀의 시야를 넘어 의식 깊숙이 각인되어 있었다.&nbsp;\u003cspan>어쩌면 그녀는 바로 그 무렵부터 자각하고 있었는지도 모른다.\u003c/span>\u003c/div>","side":"R","oy":-19,"st":{"body":"text-align: justify; text-align-last: left;"}}]},{"side":"L","items":[{"body":"서이안은 차주한을 사랑한다. 달리 해석할 여지가 없는 명백한 사실이었다. 평소 타인에게 무심히 머물던 그녀의 시선이 유독 그의 앞에서만 미묘한 변화를 보인다는 것만으로도 충분했다. 누구에게나 무던함으로 일관하던 사람이 한 존재 앞에서만 그 태도를 달리한다는 것은 생각보다 명료한 증거였으므로.\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>차주한은 그러한 그녀를 구태여 이해하려고 들지 않았다. 자신의 사소한 판단 하나가 타인의 생사를 좌우할 수도 있다는 것을 인지한 채 회귀한 그에게 누군가를 사랑한다는 것은 더 이상 허락되어서는 안 될 일이었다. 사랑은 필연적으로 상실을 수반하며 그 상실의 대가를 타인에게까지 전가할 수는 없다고 여겼다.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>그러나 그는 자신의 신념에 지나치게 안일했다. 어느덧 그녀의 모습이 시야에서 자취를 감추면 먼저 연락을 건넸고, 마주친 시선이 맞닿을 때면 별다른 까닭도 없이 웃음을 내어 주고 싶었다. 사소한 호의 하나에도 그럴듯한 명분을 부여하려 애썼으나 끝내 적당한 언어를 찾아내지 못했다. 제 행동이 무엇을 의미하는지 모를 리 없으면서도 그것을 굳이 정의하려 들지 않았다.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>곁에 있어도 되겠느냐는 서이안의 거듭된 물음에 차주한은 마침내 고개를 끄덕였다. 거절할 수 없었던 것인지, 거절하고 싶지 않았던 것인지. 그 둘 사이의 미묘한 간극을 그는 끝내 명확히 구분하지 않았다. 어쩌면 구분할 필요조차 느끼지 못했을 것이다.\u003cbr>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv>\u003ci>- 오랫동안 고민했습니다. 제 대답은 부족하지만 서이안 씨 곁에 있다, 입니다. 그래도 되겠습니까?\u003c/i>\u003c/div>\u003cdiv class=\"clk\" data-m=\"m2\">\u003cspan class=\"ck\" role=\"button\" tabindex=\"0\">( \u003ci>click\u003c/i> )\u003c/span>\u003c/div>\u003c/div>","side":"R","st":{"body":"text-align: justify; text-align-last: left;"},"oy":-7}]}]},{"name":"사람은 언제나 상실에 허덕이고","chaps":[{"side":"L","title":"\u003cspan style=\"font-weight: normal;\">(3)\u003c/span>","items":[{"body":"서이안은 서울대학교병원의 스카우트 제의를 받아 소속을 옮겼다. 때를 같이하여 우신병원이 자행해 온 만행이 관계자들의 증언을 통해 하나둘 수면 위로 드러나기 시작했고, 차주한은 이전보다 한층 분주한 나날을 보내게 되었다. 자연히 두 사람 사이의 연락 빈도도 차츰 줄어들었다. 그렇다고 어느 쪽에서도 이를 문제 삼지는 않았다. 상대의 부재를 서운해하기보다 각자의 일상을 영위하는 데 익숙해졌다고 여겼으므로.\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv>어쩌면 이는 자신이 곁에 없더라도 상대는 별다른 어려움 없이 제 삶을 이어 갈 수 있다는 방증이 될 수 있지 않겠는가? 지금의 관계에 만족하느냐고 묻는다면, 두 사람 모두 잠시의 숙고 끝에 긍정으로 답할 수 있는 사람들이었다. 적어도 그때까지는 그러했다.\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv>수화기 너머로 무미건조한 연결음만이 거듭 울렸다. 아무리 분주한 날에도 세 번의 신호음 안에는 응답하거나 상황이 여의치 않다면 뒤늦게라도 연락을 돌려주던 사람이었다. 그러나 이번에는 달랐다. 서이안은 아랫입술을 짓씹었다.&nbsp;\u003cspan>얼마 지나지 않아 마침내 전화가 다시 걸려왔다. 그러나 기다렸던 그의 목소리는 끝내 들려오지 않았다.&nbsp;\u003c/span>\u003cspan>너머에서 낯선 이의 음성이 흘러나오는 순간, 그녀는 아무런 말도 잇지 못했다. 왜 전화를 받지 않았느냐는 물음은 채 꺼내지도 못한 채 목구멍에 걸려 사라졌다. 이내 시야가 일그러졌다. 눈물이 한 방울 떨어지는가 싶더니 걷잡을 수 없이 뺨을 타고 흘러내렸다. 숨을 삼키며 애써 울음을 억누르려 했으나 소용없었다. 코트를 챙겨 드는 손끝마저 형편없이 떨리고 있었다.\u003c/span>\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv>도대체 우신이 무엇이기에. 그깟 병원이 무엇이기에 차주한이 이토록 부당한 일을 감내해야 하는가. 세상은 어째서 그에게 이토록 가혹한가.\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv>그녀는 한참 동안 침상 곁에 주저앉아 울음을 삼키지 못했다. 돌아올 대답이 거절일 것임을 누구보다 잘 알고 있었다. 그럼에도 서이안은 얼마 남지 않은 희망의 끄트머리라도 붙들어야 했다. 그것이 그를 위한 것인지, 아니면 그를 잃고 싶지 않은 자신을 위한 것인지조차 분간하지 못한 채. \u003ci>그저 자신을 위해서라도⋯⋯.\u003c/i>\u003c/div>","st":{"body":"text-align: justify; text-align-last: left;"},"pair":true},{"body":"\u003cdiv>\u003ci>\u003cbr>\u003c/i>\u003c/div>\u003ci>\u003cdiv>\u003ci>\u003cbr>\u003c/i>\u003c/div>\u003cdiv>\u003ci>\u003cbr>\u003c/i>\u003c/div>\u003cdiv>\u003ci>\u003cbr>\u003c/i>\u003c/div>\u003cdiv>\u003ci>\u003cbr>\u003c/i>\u003c/div>\u003cdiv>\u003ci>\u003cbr>\u003c/i>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>⋯⋯만약, 정말 죽기라도 했으면 어쩌려고 그랬어! 대체 어쩌려고 그랬는데. 왜, 왜 그런 짓을 해! 네가 잘못되기라도 했으면 남겨진 사람들은 어쩌라고. 나는 어쩌라고! 대체 왜 나한테는⋯⋯.\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv>미안하다고 했잖아. 그러니까 그만 울어. 눈 다 붓겠다.\u003c/div>\u003cdiv class=\"\">\u003cbr>\u003c/div>\u003cdiv>그깟 미안하다는 말로 끝내려고? 매번 그런 식이야. 사과만 하면 모든 게 해결될 줄 알아? 나는 이거 안 했으면 좋겠어. 오빠가 얼마나 간절한지 누구보다도 잘 알아. 그런데도 싫어. 아무리 원하는 일이라 해도 나는 싫다고. 그깟 일보다 차주한이라는 사람이 훨씬 더 소중해. 오빠가 이루려는 것보다 오빠가 살아 있는 게 나한테는 더 중요하단 말이야. 그러니까 제발⋯⋯.\u003c/div>\u003c/i>","side":"R","st":{"body":"text-align: justify; text-align-last: left;"},"pair":true}]},{"side":"R","title":"\u003cspan style=\"font-weight: normal;\">(4)\u003c/span>","items":[{"body":"차주한의 평온은 우신 특검을 기점으로 그 이전과 이후로 나뉘었다. 그 사이에는 결코 끝나지 않을 것만 같았던 기나긴 몇 해가 마침내 막을 내렸고, 그는 비로소 1회차와는 많은 것이 달라졌음을 실감했다.&nbsp;\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>이를테면 오로지 지금 그의 얼굴을 보고 싶다는 이유로 반차를 내고 찾아온 연인이라든가, 꽃다발을 품에 안은 채 기자회견을 마친 그에게 다가서는 수많은 사람이라든가. 무슨 일이 있어도 우호적인 관계로 남을 수 없으리라 여겼던 이들과 새롭게 맺어진 인연, 끝내 해내지 못할 것만 같았던 일들의 불확실한 것들의 성취, 그리고 이전 삶에서는 끝내 누리지 못했던 온전한 행복까지.&nbsp;\u003cspan>기자들 사이를 빠져나와 나란히 차에 오른 두 사람은 서로의 얼굴을 마주하자마자 웃음을 터뜨렸다.\u003c/span>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>\u003ci>왜 웃어.\u003c/i>\u003c/div>\u003cdiv>\u003cspan>\u003ci>그냥, 오랜만에 얼굴 보는 기분이야.\u003c/i>\u003c/span>\u003c/div>\u003cdiv>\u003cspan>\u003ci>어제도 봤잖아.\u003c/i>\u003c/span>\u003c/div>\u003cdiv>\u003ci>열여덟 시간이면 오래됐지.\u003c/i>\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>여전히 차주한의 사무실 책상 한구석에는 2년 전쯤 그녀와 맞춘 반지가 선명하게 빛나고 있었다. 이제는 저물어 가는 달을 바라보며 다가올 내일을 막연히 두려워하지 않아도 되었다. 우리가 그토록 오래 살아남으려 했던 것은 단지 오늘을 넘기기 위해서만은 아니었다. 언젠가 아무도 죽음을 걱정하지 않고 내일을 이야기할 수 있는 날이 오리라는 믿음, 사랑하는 이의 안위를 염려하는 대신 함께할 미래를 기약할 수 있으리라는 희망 때문이었다.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>우리는 수없이 많은 어제를 지나 마침내 내일을 맞이할 수 있게 된 사람들이었다. 끝내 살아남았고, 끝내 서로를 잃지 않았으며 끝내 머나먼 이곳까지 도달했다.\u003c/div>\u003cdiv>\u003cbr>\u003c/div>\u003cdiv>그러므로 이제 마주할 내일에는 더 이상 투쟁도, 희생도, 돌이킬 수 없는 이별도 없기를. 누구도 살아남기 위해 사랑하는 것을 잃지 않기를. 오래 유예되어 온 평화가 마침내 누구에게도 빼앗기지 않는 삶의 형태로 자리 잡기를. \u003ci>이제는 두려움 없이 해가 뜨는 모습을 바라볼 수 있게 되었다.&nbsp;\u003cspan>내일에도 서로의 곁에 있을 수 있다는 것. 그 평범한 기적을 더는 의심할 이유가 없었다.\u003c/span>\u003c/i>\u003c/div>\u003c/div>","st":{"body":"text-align: justify; text-align-last: left;"}},{"name":"차주한","date":"\u003cspan style=\"font-weight: normal;\">1975.6.17\u003c/span>","body":"前 서울중앙지방검찰청 평검사\u003cdiv>現 법무법인 정도 대표 변호사\u003c/div>\u003cdiv>&nbsp; &nbsp; &nbsp;우신 특검 특별검사\u003c/div>","side":"L","box":true,"tl":"\u003cspan style=\"font-weight: normal;\">( \u003ci>canon\u003c/i> )\u003c/span>","ha":"right"},{"name":"서이안","date":"\u003cspan style=\"font-weight: normal;\">1976.9.26\u003c/span>","body":"前 서울 우신병원 전공의\u003cdiv>現 서울대학교병원 외상외과 전임의\u003c/div>","side":"R","box":true,"oy":4.5,"pair":true,"tr":"\u003cspan style=\"font-weight: normal;\">( \u003ci>oc\u003c/i> )\u003c/span>"}]}]}];/*D1*/

let editing=false;
const REF={};
const PH={a:'왼쪽 위 제목',b:'왼쪽 위 작은 글씨',r:'오른쪽 위',name:'이름',date:'날짜',body:'본문',note:'메모',tl:'위쪽 왼쪽 태그',tr:'위쪽 오른쪽 태그',title:'소제목',year:'연도'};
const F=(o,k,cls)=>{const p=o._p+'.'+k;REF[p]=[o,k];return `<div class="ce ${cls}" data-p="${p}" data-ph="${PH[k]||k}" style="${(o.st&&o.st[k])||''}">${o[k]||''}</div>`};
const JS=o=>o.ha?`style="justify-content:${{left:'flex-start',center:'center',right:'flex-end',justify:'flex-start'}[o.ha]}"`:'';
const IT=(m,cls,sty)=>`<div class="item it${m.box?' bx':''} ${cls}" style="${sty}margin-bottom:${m.oy||0}em;transform:translate(${m.ox||0}em,${m.oy||0}em)">
<div class="tagrow">${F(m,'tl','tg')}${F(m,'tr','tg tr')}</div>
<div class="ihead" ${JS(m)}>${F(m,'name','name')}${F(m,'date','date')}</div>
${F(m,'body','ib')}${F(m,'note','note')}</div>`;
const ROWS=c=>{const g=[];c.items.forEach(m=>{if(m.pair&&g.length&&g[g.length-1].length===1)g[g.length-1].push(m);else g.push([m])});
return g.map(r=>{if(r.length===1){const m=r[0];return `<div class="irow ${m.side||c.side||'R'}" style="--dy:${m.dy||0}">${IT(m,'','')}</div>`}
const a=r[0],b=r[1],as=a.side||c.side||'R',bs=as==='L'?'R':'L';
return `<div class="irow pair" style="--dy:${a.dy||0}">${IT(a,'s'+as,'')}${IT(b,'s'+bs,'margin-top:'+(b.dy||0)+'em;')}</div>`}).join('')};

const app=document.getElementById('app');
let io=null;
const render=()=>{
for(const k in REF)delete REF[k];META._p='meta';
DATA.forEach((r,ri)=>{r._p=String(ri);r.chaps.forEach((c,ci)=>{c._p=ri+'.'+ci;c.items.forEach((m,ii)=>{m._p=ri+'.'+ci+'.'+ii})})});
app.innerHTML='<div class="hd"><div class="l">'+F(META,'a','a')+F(META,'b','b')+'</div>'+F(META,'r','r')+'</div><div class="tl">'+DATA.map((r,ri)=>`<section class="round ${(r.open||ri>=1)?'open':''}">
<div class="hrow rhd ${r.side||'R'}"><div class="hb"><div class="head" ${ri===0?'data-a="tog" role="button" tabindex="0"':''} ${JS(r)}><span class="ce etitle" data-p="${r._p}.name" data-ph="제목">${r.name||''}</span></div></div></div>
<div class="rbody">${r.chaps.map(c=>`<div class="chap${/^\(\d+\)$/.test((c.title||'').replace(/<[^>]*>/g,'').trim())?' seq':''}">
<div class="hrow ${c.side}"><div class="hb"><div class="head" ${JS(c)}>${F(c,'title','etitle')}${F(c,'year','year')}</div></div></div>
${ROWS(c)}</div>`).join('')}</div></section>`).join('')+'</div>';
document.querySelectorAll('.ce').forEach(ce=>{
const isB=d=>d.tagName==='DIV'&&!d.textContent.trim()&&d.querySelector('br')&&!d.querySelector('div');
ce.querySelectorAll('div').forEach(d=>{if(isB(d))d.dataset.b='1'});
const toks=[];const w=document.createTreeWalker(ce,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);
for(let n=w.nextNode();n;n=w.nextNode()){if(n.nodeType===1){if(n.dataset.b)toks.push(['B',n])}else if(n.textContent.trim()&&!n.parentElement.closest('[data-b]'))toks.push(['T',n])}
let i=0;while(i<toks.length){if(toks[i][0]!=='B'){i++;continue}let j=i;while(j<toks.length&&toks[j][0]==='B')j++;
